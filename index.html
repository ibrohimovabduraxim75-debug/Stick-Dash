<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
    <title>Stick Dash</title>
    <style>
        html,
        body {
            margin: 0;
            height: 100%;
            background: #05050a;
            overflow: hidden;
            font-family: 'Segoe UI', Arial, sans-serif
        }

        #wrap {
            position: absolute;
            left: 0;
            top: 0;
            width: 960px;
            height: 640px;
            transform-origin: 0 0;
            background: #111;
            user-select: none
        }

        canvas#c {
            position: absolute;
            left: 0;
            top: 0;
            display: block;
            touch-action: none
        }

        #bar {
            position: absolute;
            left: 0;
            top: 540px;
            width: 960px;
            height: 100px;
            background: #1b1b26;
            color: #ccd;
            box-sizing: border-box;
            padding: 4px 8px;
            font-size: 12px;
            overflow: auto
        }

        #bar .row {
            display: flex;
            gap: 3px;
            align-items: center;
            margin: 2px 0;
            overflow-x: auto;
            white-space: nowrap
        }

        #bar button,
        #bar input,
        #bar select {
            font-size: 12px;
            padding: 3px 7px;
            border-radius: 5px;
            border: 1px solid #445;
            background: #2a2a3c;
            color: #fff;
            cursor: pointer
        }

        #bar input {
            cursor: text;
            background: #12121c
        }

        #bar button.on {
            background: #3b82f6;
            border-color: #9cf
        }

        #bar .hint {
            opacity: .75
        }

        #ui {
            position: absolute;
            inset: 0;
            background: rgba(10, 18, 40, .9);
            color: #fff;
            overflow: auto;
            box-sizing: border-box;
            padding: 16px 28px;
            display: none
        }

        #ui.ov {
            background: rgba(0, 0, 0, .65);
            display: flex;
            align-items: center;
            justify-content: center
        }

        #ui h1.title {
            font-size: 58px;
            text-align: center;
            margin: 18px 0 4px;
            letter-spacing: 5px;
            text-shadow: 0 4px 0 #1e40af
        }

        #ui h2 {
            margin: 6px 0 10px
        }

        #ui h2 small {
            color: #fc0;
            font-size: 16px;
            margin-left: 10px
        }

        #ui button {
            font-size: 15px;
            padding: 8px 16px;
            margin: 4px;
            border-radius: 8px;
            border: 1px solid #5a6fa8;
            background: #243a6e;
            color: #fff;
            cursor: pointer
        }

        #ui button:hover:not(:disabled) {
            background: #35539a
        }

        #ui button.big {
            font-size: 20px;
            padding: 11px 30px;
            min-width: 300px
        }

        #ui button.back {
            position: absolute;
            right: 24px;
            top: 14px
        }

        #ui .col {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 8px
        }

        #ui .who {
            text-align: center;
            font-size: 18px;
            color: #fc0
        }

        #ui .card {
            background: #161f3a;
            border: 2px solid #5a6fa8;
            border-radius: 14px;
            padding: 22px 34px;
            text-align: center;
            min-width: 340px;
            max-height: 92%;
            overflow: auto
        }

        #ui .gold {
            color: #fc0;
            font-size: 20px
        }

        #ui .grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px
        }

        #ui .lv {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0 !important;
            padding: 8px 0 !important
        }

        #ui .lv b {
            font-size: 20px
        }

        #ui .lv span {
            font-size: 12px;
            color: #fc0
        }

        #ui .lv.done {
            background: #1f6b3a
        }

        #ui .lv.lock {
            opacity: .35
        }

        #ui .on {
            background: #3b82f6 !important
        }

        #ui .sw {
            display: flex;
            flex-wrap: wrap
        }

        #ui .swb {
            display: flex;
            align-items: center;
            gap: 6px
        }

        #ui .swb i {
            display: inline-block;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            border: 2px solid #fff
        }

        #ui .row {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #16224a;
            margin: 4px 0;
            padding: 6px 10px;
            border-radius: 8px
        }

        #ui .row b {
            flex: 1
        }

        #ui .row span {
            opacity: .85;
            font-size: 13px
        }

        #ui table {
            width: 100%;
            border-collapse: collapse
        }

        #ui td,
        #ui th {
            padding: 4px 8px;
            text-align: left;
            border-bottom: 1px solid #2a3a6a
        }

        #ui input,
        #ui textarea,
        #ui select {
            background: #0e1630;
            color: #fff;
            border: 1px solid #5a6fa8;
            border-radius: 6px;
            padding: 6px 10px;
            font-size: 14px
        }

        #ui textarea {
            width: 100%;
            height: 70px;
            box-sizing: border-box;
            font-size: 11px
        }

        #ui p {
            line-height: 1.5
        }

        #ui label {
            display: block;
            margin: 6px 0 2px;
            font-size: 13px;
            opacity: .85;
            text-align: left
        }

        #ui .cm {
            background: #121a35;
            border-radius: 8px;
            padding: 6px 10px;
            margin: 4px 0;
            text-align: left;
            font-size: 14px
        }

        #ui .cm small {
            opacity: .6
        }

        #toast {
            position: absolute;
            left: 50%;
            bottom: 110px;
            transform: translateX(-50%);
            background: #000c;
            color: #fff;
            padding: 8px 18px;
            border-radius: 8px;
            opacity: 0;
            transition: opacity .3s;
            pointer-events: none;
            z-index: 9;
            max-width: 80%
        }
    </style>
</head>

<body>
    <div id="wrap"><canvas id="c" width="960" height="540"></canvas>
        <div id="bar"></div>
        <div id="ui"></div>
        <div id="toast"></div>
    </div>
    <script>
        'use strict';
        // =============================================================== HELPERS
        const $ = id => document.getElementById(id);
        const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
        const hs = s => { let h = 5381; for (let i = 0; i < s.length; i++)h = ((h << 5) + h + s.charCodeAt(i)) | 0; return h; };

        const cv = $('c'), ctx = cv.getContext('2d');

        function hsl(h, s, l) { h = ((h % 360) + 360) % 360; s /= 100; l /= 100; const a = s * Math.min(l, 1 - l), f = n => { const k = (n + h / 30) % 12; return Math.round(255 * (l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1)))); }; return '#' + [f(0), f(8), f(4)].map(v => v.toString(16).padStart(2, '0')).join(''); }
        const rgb = h => { h = String(h || '#000000'); return [parseInt(h.slice(1, 3), 16) || 0, parseInt(h.slice(3, 5), 16) || 0, parseInt(h.slice(5, 7), 16) || 0]; };
        const rgbs = c => `rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})`;
        const mix = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
        const lerpC = (a, b, k) => { for (let i = 0; i < 3; i++)a[i] += (b[i] - a[i]) * k; };

        const off = (b, x, y) => [b[0] + x, b[1] + y, b[2], b[3]];
        function rotBox(r, b) { for (let i = 0; i < (r & 3); i++) { const x1 = b[0] - 15, y1 = b[1] - 15, x2 = x1 + b[2], y2 = y1 + b[3]; b = [Math.min(y1, y2) + 15, Math.min(-x1, -x2) + 15, Math.abs(y2 - y1), Math.abs(x2 - x1)]; } return b; }

        // =============================================================== CONFIG / ACCOUNTS
        let CFG = Object.assign({ server: '', mv: .6, sv: .6, auto: 0, hb: 0 }, DB.get('sd_cfg', {}));
        const saveCfg = () => DB.set('sd_cfg', CFG);
        let accts = DB.get('sd_acc', {}), me = null;
        const save = () => DB.set('sd_acc', accts);
        const ICONS = [['stick', 0], ['square', 0], ['face', 10], ['cross', 20], ['ring', 30], ['bolt', 45]];
        const COLS = [['#ffffff', 0], ['#ffd400', 0], ['#ff3b3b', 0], ['#3bff7a', 0], ['#3bd5ff', 5], ['#c03bff', 8], ['#ff8a3b', 10], ['#ff66b2', 15], ['#222222', 20], ['rainbow', 60]];
        const newAcct = n => ({ nick: n, stars: 0, icon: { k: 'stick', c1: '#ffffff', c2: '#3bd5ff' }, own: ['k:stick', 'k:square', 'c:#ffffff', 'c:#ffd400', 'c:#ff3b3b', 'c:#3bff7a'], done: {}, drafts: [], liked: [], songs: [], token: '' });
        const colr = c => c === 'rainbow' ? `hsl(${(performance.now() / 5) % 360},90%,60%)` : c;

        // =============================================================== OBJECT DEFINITIONS
        const O = {};
        const def = (cat, id, n, w, h, k, x) => { O[id] = Object.assign({ cat, n, w, h, k, oy: 0, ox: 0, rot: 0 }, x || {}); };
        [['b1', 'Block'], ['b2', 'Metal'], ['b3', 'Neon'], ['b4', 'Glass']].forEach(a => def('Blocks', a[0], a[1], 1, 1, 'solid'));
        def('Blocks', 's1', 'Slab', 1, 1, 'solid', { rot: 1 });
        def('Hazards', 'sp', 'Spike', 1, 1, 'haz', { rot: 1, hb: [11, 0, 8, 15] });
        def('Hazards', 'sm', 'Small spike', 1, 1, 'haz', { rot: 1, hb: [11, 0, 8, 8] });
        def('Hazards', 'sw', 'Saw', 1, 1, 'saw', { r: 13 });
        def('Hazards', 'sl', 'Big saw', 3, 3, 'saw', { r: 40, ox: 1, oy: 1 });
        const PMODES = [['pcube', 'Cube', 'cube', 'C', '#3df'], ['pship', 'Ship', 'ship', 'S', '#f4a'], ['pball', 'Ball', 'ball', 'B', '#f84'], ['pufo', 'UFO', 'ufo', 'U', '#fd2'], ['pwave', 'Wave', 'wave', 'W', '#4f8'], ['probot', 'Robot', 'robot', 'R', '#aaa'], ['pspider', 'Spider', 'spider', 'P', '#a5f'], ['pswing', 'Swing', 'swing', 'G', '#fe5']];
        PMODES.forEach(a => def('Portals', a[0], a[1] + ' portal', 1, 3, 'portal', { oy: 1, m: a[2], g: a[3], c: a[4] }));
        def('Portals', 'pgd', 'Gravity down', 1, 3, 'portal', { oy: 1, gv: 1, g: '↓', c: '#4af' });
        def('Portals', 'pgu', 'Gravity up', 1, 3, 'portal', { oy: 1, gv: -1, g: '↑', c: '#fa4' });
        def('Portals', 'pmini', 'Mini', 1, 3, 'portal', { oy: 1, mi: 1, g: 'm', c: '#f6c' });
        def('Portals', 'pbig', 'Normal size', 1, 3, 'portal', { oy: 1, mi: 0, g: 'M', c: '#6cf' });
        [['pv05', '0.5x', 0, '#fa3'], ['pv1', '1x', 1, '#3cf'], ['pv2', '2x', 2, '#3f6'], ['pv3', '3x', 3, '#f3c'], ['pv4', '4x', 4, '#f33']].forEach(a => def('Portals', a[0], 'Speed ' + a[1], 1, 3, 'portal', { oy: 1, sp: a[2], g: a[1], c: a[3] }));
        const ORBC = { oy: ['Yellow orb', '#ffd400'], op: ['Pink orb', '#ff5fd0'], or: ['Red orb', '#ff3b3b'], ob: ['Blue orb', '#3b9bff'], og: ['Green orb', '#3bff7a'], ok: ['Black orb', '#555'] };
        for (const k in ORBC) def('Orbs', k, ORBC[k][0], 1, 1, 'orb', { c: ORBC[k][1] });
        const PADC = { ay: ['Yellow pad', '#ffd400'], ap: ['Pink pad', '#ff5fd0'], ar: ['Red pad', '#ff3b3b'], ab: ['Blue pad', '#3b9bff'] };
        for (const k in PADC) def('Pads', k, PADC[k][0], 1, 1, 'pad', { rot: 1, c: PADC[k][1] });
        def('Triggers', 'tbg', 'BG color', 1, 1, 'trig', { p: '#2a5fd8', l: 'BG' });
        def('Triggers', 'tgr', 'Ground color', 1, 1, 'trig', { p: '#15338f', l: 'GR' });
        def('Triggers', 'tblk', 'Block color', 1, 1, 'trig', { p: '#ffffff', l: 'BL' });
        def('Triggers', 'tshake', 'Shake', 1, 1, 'trig', { p: .6, l: 'SH' });
        def('Triggers', 'tpulse', 'Pulse', 1, 1, 'trig', { p: '#ffffff', l: 'PU' });
        def('Triggers', 'tzoom', 'Zoom', 1, 1, 'trig', { p: 1.3, l: 'ZM' });
        [['dpil', 'Pillar'], ['dgrs', 'Grass'], ['dcld', 'Cloud'], ['dstr', 'Star'], ['darr', 'Arrow'], ['dchn', 'Chain'], ['dgear', 'Gear'], ['dsq', 'Squares'], ['dring', 'Ring']].forEach(a => def('Deco', a[0], a[1], 1, 1, 'deco', { rot: a[0] === 'darr' }));
        def('Other', 'coin', 'Secret coin', 1, 1, 'coin');
        const CATS = ['Blocks', 'Hazards', 'Portals', 'Orbs', 'Pads', 'Triggers', 'Deco', 'Other'];
        const SMODES = ['cube', 'ship', 'ball', 'ufo', 'wave', 'robot', 'spider', 'swing'];
        const CEIL = ['ship', 'ball', 'ufo', 'wave', 'swing', 'spider'];
        const SPD = [8.37, 10.39, 12.9, 15.6, 19.2].map(v => v * T);
        const SPN = ['0.5x', '1x', '2x', '3x', '4x'];
        const JV = 738, G = 4250, DT = 1 / 240;
        const DIFFN = ['Easy', 'Easy', 'Normal', 'Normal', 'Hard', 'Hard', 'Harder', 'Insane', 'Insane', 'Demon'];

        // =============================================================== LEVELS: prep / validate / estimate
        function prep(L) {
            const ix = [], st = [], big = [], trig = [], coins = [];
            for (const o of L.objs) {
                const d = O[o.i]; if (!d) continue; const w = (o.w || d.w) * T, h = (o.h || d.h) * T, x = o.x * T, y = o.y * T; o._k = d.k; o._w = w; o._h = h;
                if (d.k === 'solid') o._b = o.i === 's1' ? off(rotBox(o.r | 0, [0, 0, 30, 15]), x, y) : [x, y, w, h];
                else if (d.k === 'haz') o._b = off(rotBox(o.r | 0, d.hb), x, y);
                else if (d.k === 'saw') o._c = [x + w / 2, y + h / 2, d.r];
                else if (d.k === 'orb') o._c = [x + 15, y + 15, 20];
                else if (d.k === 'pad') o._b = off(rotBox(o.r | 0, [2, 0, 26, 10]), x, y);
                else if (d.k === 'portal') o._b = [x + 8, y, 14, 90];
                else if (d.k === 'coin') { o._c = [x + 15, y + 15, 15]; coins.push(o); }
                else if (d.k === 'trig') trig.push(o);

                if (c1 - c0 > 3) big.push(o); else (st[c0] = st[c0] || []).push(o);

        }
        function cleanLevel(L) {

                if (!L || typeof L.name !== 'string' || !Array.isArray(L.objs) || L.objs.length > 12000) return null;

                for (const o of L.objs) {
                    const d = O[o.i]; if (!d) continue; const q = { i: o.i, x: +o.x, y: +o.y, r: (o.r | 0) & 3 };

                }

                return { v: 2, name: String(L.name).slice(0, 30), desc: String(L.desc || '').slice(0, 140), author: String(L.author || '?').slice(0, 16), cols: clamp(L.cols | 0, 20, 3000), mode: L.mode === 'platformer' ? 'platformer' : 'classic', song, sp: clamp(L.sp | 0, 0, 4), sm: SMODES.includes(L.sm) ? L.sm : 'cube', mini: L.mini ? 1 : 0, gs: L.gs === -1 ? -1 : 1, bg: C.test(L.bg) ? L.bg : '#2a5fd8', gr: C.test(L.gr) ? L.gr : '#15338f', objs: o2 };
            } catch (e) { return null; }
        }
        function est(L) {
            let hz = 0, oc = 0, msp = 1, sw = 0; const mf = [.81, 1, 1.25, 1.5, 1.85], modes = new Set([L.sm]);
            for (const o of L.objs) {
                const d = O[o.i]; if (!d) continue;
                if (d.k === 'haz' || d.k === 'saw') hz++; else if (d.k === 'orb' || d.k === 'pad') oc++;
                else if (d.k === 'portal') { if (d.m) modes.add(d.m); if (d.sp !== undefined) msp = Math.max(msp, mf[d.sp]); if (d.mi) sw++; }
            }
            const c = L.cols, sc = hz / (c / 10) * 1.6 + oc / (c / 10) * 1.2 + modes.size * .7 + (msp - 1) * 3 + c / 160 + sw * .2 + (L.mode === 'platformer' ? .5 : 0);
            return clamp(Math.round(sc), 1, 10);
        }
        const newLevel = () => ({ v: 2, name: 'My Level', desc: '', author: '', cols: 150, mode: 'classic', song: { t: 'b', i: 0, off: 0 }, sp: 1, sm: 'cube', mini: 0, gs: 1, bg: '#2a5fd8', gr: '#15338f', objs: [] });
        const encodeLv = o => btoa(unescape(encodeURIComponent(ser(o))));
        const decodeLv = s => { try { return JSON.parse(decodeURIComponent(escape(atob(s.trim())))); } catch (e) { return null } };

        // =============================================================== MAIN LEVEL GENERATOR (100 levels)
        const N_MAIN = 100, mainStars = i => 1 + Math.floor((i - 1) / 10);
        const PMID = { cube: 'pcube', ship: 'pship', ball: 'pball', ufo: 'pufo', wave: 'pwave', robot: 'probot', spider: 'pspider', swing: 'pswing' };
        function genMain(i) {
            const r = mulberry(i * 9973 + 7), d = (i - 1) / (N_MAIN - 1), objs = [];
            const add = (id, x, y, rr, p, w, h) => { const o = { i: id, x, y, r: rr || 0 }; if (p !== undefined) o.p = p; if (w > 1 || h > 1) { o.w = w; o.h = h; } objs.push(o); return o; };
            const avail = [['cube', 1], ['ship', 6], ['ball', 15], ['ufo', 25], ['wave', 35], ['robot', 45], ['spider', 55], ['swing', 65]].filter(a => i >= a[1]).map(a => a[0]);
            const hue = (i * 37) % 360, coinSpots = [];
            const L = { v: 2, name: 'Level ' + i, desc: '', author: 'StickDash', mode: 'classic', song: { t: 'b', i: i % 4, off: 0 }, sp: 1, sm: 'cube', mini: 0, gs: 1, bg: hsl(hue, 55, 32), gr: hsl(hue + 25, 55, 18), objs };
            const stack = (id, x, p) => { for (let k = 0; k < 4; k++)add(id, x, k * 3, 0, p); };
            let x = 16, mode = 'cube', spI = 1;
            const spOpts = d < .12 ? [1] : d < .3 ? [1, 2] : d < .55 ? [1, 2, 3] : [1, 2, 3, 4];
            const nSec = 3 + Math.floor(d * 7) + (i % 3);

            else if (m === 'ship') { c.rotate(rot); c.fillStyle = b; c.strokeStyle = '#000'; c.lineWidth = 2; c.beginPath(); c.moveTo(-r * 1.1, r * .5); c.lineTo(-r * .6, -r * .2); c.lineTo(r * 1.2, 0); c.lineTo(r * .9, r * .55); c.closePath(); c.fill(); c.stroke(); c.fillStyle = a; c.beginPath(); c.moveTo(-r * 1.1, r * .5); c.lineTo(-r * 1.3, -r * .2); c.lineTo(-r * .7, .1); c.fill(); c.save(); c.translate(r * .1, -r * .5); c.scale(.55, .55); iconShape(c, ic.k, r, ic.c1, ic.c2); c.restore(); }
            else if (m === 'ball') { c.rotate(rot); c.fillStyle = a; c.strokeStyle = '#000'; c.lineWidth = 2; c.beginPath(); c.arc(0, 0, r, 0, 7); c.fill(); c.stroke(); c.strokeStyle = b; c.lineWidth = 3; c.beginPath(); c.moveTo(-r * .8, 0); c.lineTo(r * .8, 0); c.moveTo(0, -r * .8); c.lineTo(0, r * .8); c.stroke(); }
            else if (m === 'ufo') { c.rotate(rot); c.fillStyle = b; c.strokeStyle = '#000'; c.lineWidth = 2; c.beginPath(); c.ellipse(0, r * .35, r * 1.2, r * .45, 0, 0, 7); c.fill(); c.stroke(); c.save(); c.beginPath(); c.rect(-r, -r * 1.2, 2 * r, r * 1.25); c.clip(); c.translate(0, -r * .1); c.scale(.8, .8); iconShape(c, ic.k, r, ic.c1, ic.c2); c.restore(); }
            else if (m === 'wave') { c.rotate(rot); c.fillStyle = a; c.strokeStyle = b; c.lineWidth = 2; c.beginPath(); c.moveTo(-r * 1.1, -r * .9); c.lineTo(r * 1.3, 0); c.lineTo(-r * 1.1, r * .9); c.lineTo(-r * .5, 0); c.closePath(); c.fill(); c.stroke(); }
            else if (m === 'swing') { c.rotate(rot); iconShape(c, ic.k, r * .8, ic.c1, ic.c2); c.fillStyle = b; c.beginPath(); c.moveTo(-r * .8, -r * .2); c.lineTo(-r * 1.5, -r * .9); c.lineTo(-r * .8, r * .4); c.fill(); c.beginPath(); c.moveTo(r * .8, -r * .2); c.lineTo(r * 1.5, -r * .9); c.lineTo(r * .8, r * .4); c.fill(); }
            c.restore();
        }
        function drawPlay() {
            zoom += (tzoom - zoom) * .06; vw = W / zoom; vh = H / zoom; const p = pl;
            const tx = lv.mode === 'platformer' ? p.x - vw * .5 : p.x - vw * .3; camX = lv.mode === 'platformer' ? camX + (tx - camX) * .15 : tx; if (camX < -100) camX = -100;
            const band = CEIL.includes(p.mode);
            const ty = band ? (p.lo + p.hi) / 2 - vh / 2 : Math.max(-.222 * vh, p.y + 15 - vh * .42); camY += (ty - camY) * .12;
            lerpC(bgc, tbg, .04); lerpC(grc, tgr, .04); lerpC(blk, tblk, .06);
            ctx.save(); ctx.scale(zoom, zoom);
            if (shakeT > 0) ctx.translate((Math.random() - .5) * shakeT * 18, (Math.random() - .5) * shakeT * 18);
            drawBG(ctx, false); drawWorld(ctx, false);
            for (const o of lv._co) if (!p.coins.has(o)) drawObj(ctx, o, false);
            if (practice) for (const s of cps) { const x = sX(s.p.x), y = sY(s.p.y + s.p.s / 2); ctx.fillStyle = '#3f6'; ctx.beginPath(); ctx.moveTo(x, y - 10); ctx.lineTo(x + 8, y); ctx.lineTo(x, y + 10); ctx.lineTo(x - 8, y); ctx.fill(); }
            if (trail.length > 1 && p.mode === 'wave') { ctx.strokeStyle = colr(me.icon.c1); ctx.lineWidth = 5; ctx.lineJoin = 'round'; ctx.beginPath(); trail.forEach((q, i) => { const X = sX(q.x), Y = sY(q.y); i ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y); }); ctx.stroke(); }
            if (p.dead <= 0) drawPlayer(ctx, sX(p.x + p.s / 2), sY(p.y + p.s / 2), p.s, p.mode, p.rot, p.gs, me.icon);
            if (CFG.hb) { ctx.strokeStyle = '#0f0'; ctx.strokeRect(sX(p.x), sY(p.y + p.s), p.s, p.s); }
            for (const q of parts) { ctx.globalAlpha = Math.max(0, q.l * 2); ctx.fillStyle = q.c; ctx.fillRect(sX(q.x) - 2, sY(q.y) - 2, 4, 4); } ctx.globalAlpha = 1;
            const ex = sX(lv.cols * T); ctx.fillStyle = 'rgba(255,255,255,.8)'; ctx.fillRect(ex, 0, 6, vh); ctx.fillStyle = 'rgba(255,255,255,.12)'; ctx.fillRect(ex, 0, 2000, vh);
            ctx.restore();
            if (flashT > 0) { ctx.globalAlpha = flashT * 1.4; ctx.fillStyle = flashC; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
            const pc = Math.floor(pct()); ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.fillRect(330, 10, 300, 10); ctx.fillStyle = '#3f6'; ctx.fillRect(330, 10, 3 * pc, 10);
            ctx.fillStyle = '#fff'; ctx.font = 'bold 14px sans-serif'; ctx.textAlign = 'center'; ctx.fillText(pc + '%', 480, 38);
            ctx.textAlign = 'left'; ctx.font = '13px sans-serif'; ctx.fillText(`${cur.name} · Attempt ${att} · ${SPN[p.sp]}${practice ? ' · PRACTICE (' + cps.length + ' cp)' : ''}`, 10, 20);
            ctx.textAlign = 'right'; ctx.fillText('II', W - 18, 26); ctx.textAlign = 'left';
        }

  <b>Modes:</b> Cube, Ship (hold to rise), Ball (tap = flip gravity), UFO (tap = hop), Wave (hold = up diagonal), Robot (hold = higher jump), Spider (tap = teleport to other surface), Swing (tap = flip).<br>

        function delDraft(id) { if (!confirm('Delete this draft?')) return; me.drafts = me.drafts.filter(d => d.id !== id); save(); editorHome(); }
        function importDraft() { const o = cleanLevel(decodeLv($('code').value)); if (!o) return toast('Invalid code'); me.drafts.push({ id: 'd' + Date.now().toString(36), L: o }); save(); editorHome(); }
        function openDraft(id) { const d = me.drafts.find(x => x.id === id); if (!d) return; ed = { id, L: JSON.parse(ser(d.L)), cx: 0, ey: 0, cat: 'Blocks', sel: 'b1', rot: 0, tool: 'place', so: null, un: [], re: [] }; ed.L.author = me.nick; backToEditor(); }
        function backToEditor() { mode = 'edit'; parts = []; AU.stop(); hideUI(); prep(ed.L); edBar(); }
        function edSaveDraft() { const i = me.drafts.findIndex(x => x.id === ed.id); const L = JSON.parse(ser(ed.L)); if (i < 0) me.drafts.push({ id: ed.id, L }); else me.drafts[i].L = L; save(); }
        function edChanged() { prep(ed.L); }
        function edPush() { ed.un.push(ser(ed.L.objs)); if (ed.un.length > 80) ed.un.shift(); ed.re = []; }
        function edUndo() { if (!ed.un.length) return; ed.re.push(ser(ed.L.objs)); ed.L.objs = JSON.parse(ed.un.pop()); ed.so = null; edChanged(); edBar(); }
        function edRedo() { if (!ed.re.length) return; ed.un.push(ser(ed.L.objs)); ed.L.objs = JSON.parse(ed.re.pop()); ed.so = null; edChanged(); edBar(); }
        function edBar() {
            const objs = Object.keys(O).filter(k => O[k].cat === ed.cat);
            const so = ed.so, sp = so && O[so.i] && O[so.i].k === 'trig' ? `<span> Param: ${typeof so.p === 'string' ? `<input type="color" value="${so.p}" onchange="edParam(this.value)">` : `<input type="number" step=".1" value="${so.p}" style="width:60px" onchange="edParam(+this.value)">`}</span>` : (so && O[so.i] && O[so.i].k === 'portal' && O[so.i].m ? `<span> Base row <input type="number" min="0" max="40" value="${typeof so.p === 'number' ? so.p : ''}" placeholder="auto" style="width:60px" onchange="edParam(this.value===''?undefined:+this.value)"></span>` : '');
            bar(`<div class="row">${CATS.map(c => `<button class="${ed.cat === c ? 'on' : ''}" onclick="ed.cat='${c}';edBar()">${c}</button>`).join('')}|
  ${['place', 'erase', 'select'].map(t => `<button class="${ed.tool === t ? 'on' : ''}" onclick="ed.tool='${t}';edBar()">${t}</button>`).join('')}
  <button onclick="edRot()">⟳ Rot</button><button onclick="edUndo()">↶</button><button onclick="edRedo()">↷</button><button onclick="edDel()">Del</button><button onclick="edDup()">Dup</button>${sp}</div>
  <div class="row">${objs.map(k => `<button class="${ed.sel === k && ed.tool === 'place' ? 'on' : ''}" onclick="ed.sel='${k}';ed.tool='place';edBar()">${O[k].n}</button>`).join('')}</div>
  <div class="row"><button onclick="edTest()">▶ Test</button><button onclick="edSettings()">⚙ Level settings</button><button onclick="edSaveDraft();toast('Saved')">💾 Save</button><button onclick="edPublish()">🌐 Publish</button><button onclick="edShare()">📋 Code</button><button onclick="edExit()">⬅ Exit</button>
  <span class="hint">Verified: <b>${ed.L.ver && ed.L.ver === edHash() ? '✔' : '✘ (finish a Test run)'}</b> · A/D scroll · W/S height · R rotate · Del · Ctrl+Z/Y · blocks: drag a rectangle</span></div>`);
        }
        function edParam(v) { if (!ed.so) return; if (v === undefined) delete ed.so.p; else ed.so.p = v; }
        function edRot() { if (ed.so && O[ed.so.i].rot) { edPush(); ed.so.r = ((ed.so.r | 0) + 1) & 3; edChanged(); } else ed.rot = (ed.rot + 1) & 3; }
        function edDel() { if (!ed.so) return; edPush(); ed.L.objs = ed.L.objs.filter(o => o !== ed.so); ed.so = null; edChanged(); edBar(); }
        function edDup() { if (!ed.so) return; edPush(); const o = JSON.parse(ser(ed.so)); o.x += 1; ed.L.objs.push(o); ed.so = o; edChanged(); }
        function edKey(e) {
            if (e.code === 'KeyR' && !e.ctrlKey) edRot(); else if (e.code === 'Delete' || e.code === 'Backspace') edDel();
            else if (e.ctrlKey && e.code === 'KeyZ') { edUndo(); e.preventDefault(); } else if (e.ctrlKey && e.code === 'KeyY') { edRedo(); e.preventDefault(); } else if (e.ctrlKey && e.code === 'KeyD') { edDup(); e.preventDefault(); }
        }
        function edExit() { edSaveDraft(); editorHome(); }
        function edTest() { edSaveDraft(); const L = JSON.parse(ser(ed.L)); startPlay(L, { kind: 'test', id: null, name: 'TEST: ' + ed.L.name, stars: est(L), L }); }
        function cellAt(e) { const m = mpos(e); return { x: clamp(Math.floor((m.x + ed.cx) / T), 0, ed.L.cols - 1), y: Math.max(0, Math.floor((480 - m.y + ed.ey) / T)) }; }
        function dims(o) { const d = O[o.i]; return [(o.w || d.w), (o.h || d.h)]; }
        function pick(c) { const a = ed.L.objs; for (let i = a.length - 1; i >= 0; i--) { const o = a[i]; if (!O[o.i]) continue; const [w, h] = dims(o); if (c.x >= o.x && c.x < o.x + w && c.y >= o.y && c.y < o.y + h) return o; } return null; }
        function edDown(e) {
            if (e.button === 1) return; const c = cellAt(e);
            if (e.button === 2 || ed.tool === 'erase') { const o = pick(c); if (o) { edPush(); ed.L.objs = ed.L.objs.filter(x => x !== o); if (ed.so === o) ed.so = null; edChanged(); } return; }
            if (ed.tool === 'select') { const o = pick(c); ed.so = o; edDrag = o ? { m: 'move', o, sx: c.x, sy: c.y, ox: o.x, oy: o.y, pushed: false } : null; edBar(); return; }
            const d = O[ed.sel];
            if (['b1', 'b2', 'b3', 'b4'].includes(ed.sel)) { edDrag = { m: 'rect', x: c.x, y: c.y, x2: c.x, y2: c.y }; return; }
            edPush(); const o = { i: ed.sel, x: c.x - d.ox, y: Math.max(0, c.y - d.oy), r: d.rot ? ed.rot : 0 }; if (d.p !== undefined) o.p = d.p;
            ed.L.objs = ed.L.objs.filter(q => !(q.i === o.i && q.x === o.x && q.y === o.y)); ed.L.objs.push(o); ed.so = o; edChanged();
        }
        function edMove(e) {
            edHover = cellAt(e); if (!edDrag) return;
            if (edDrag.m === 'rect') { edDrag.x2 = edHover.x; edDrag.y2 = edHover.y; }
            else if (edDrag.m === 'move') { if (!edDrag.pushed && (edHover.x !== edDrag.sx || edHover.y !== edDrag.sy)) { edPush(); edDrag.pushed = true; } if (edDrag.pushed) { edDrag.o.x = Math.max(0, edDrag.ox + edHover.x - edDrag.sx); edDrag.o.y = Math.max(0, edDrag.oy + edHover.y - edDrag.sy); edChanged(); } }
        }
        function edUp() {
            if (!edDrag) return; const dd = edDrag; edDrag = null;
            if (dd.m === 'rect') { const x1 = Math.min(dd.x, dd.x2), x2 = Math.max(dd.x, dd.x2), y1 = Math.min(dd.y, dd.y2), y2 = Math.max(dd.y, dd.y2); edPush(); const o = { i: ed.sel, x: x1, y: y1, r: 0 }; if (x2 > x1 || y2 > y1) { o.w = x2 - x1 + 1; o.h = y2 - y1 + 1; } ed.L.objs.push(o); ed.so = o; edChanged(); }
            edBar();
        }
        function drawEditor(dt) {
            const sx = ((keys.KeyD || keys.ArrowRight) ? 1 : 0) - ((keys.KeyA || keys.ArrowLeft) ? 1 : 0), sy = (keys.KeyW || keys.ArrowUp ? 1 : 0) - (keys.KeyS || keys.ArrowDown ? 1 : 0);
            ed.cx = clamp(ed.cx + sx * 800 * dt, 0, Math.max(0, ed.L.cols * T - W)); ed.ey = Math.max(0, ed.ey + sy * 600 * dt);
            zoom = 1; vw = W; vh = H; camX = ed.cx; camY = -60 + ed.ey; pl = null; lv = ed.L; bgc = rgb(ed.L.bg); grc = rgb(ed.L.gr); blk = [255, 255, 255];
            ctx.save(); drawBG(ctx, true); drawWorld(ctx, true);
            ctx.strokeStyle = 'rgba(255,255,255,.1)'; ctx.lineWidth = 1;
            for (let x = Math.floor(camX / T) * T; x < camX + W + T; x += T) { ctx.beginPath(); ctx.moveTo(sX(x), 0); ctx.lineTo(sX(x), H); ctx.stroke(); }
            for (let y = Math.floor(camY / T) * T; y < camY + H + T; y += T) { ctx.beginPath(); ctx.moveTo(0, sY(y)); ctx.lineTo(W, sY(y)); ctx.stroke(); }
            ctx.fillStyle = '#2ecc71'; ctx.fillRect(sX(2 * T), sY(T), T, T); ctx.fillStyle = '#fff'; ctx.font = 'bold 14px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('S', sX(2 * T) + 15, sY(T) + 20); ctx.textAlign = 'left';
            ctx.strokeStyle = '#f44'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(sX(ed.L.cols * T), 0); ctx.lineTo(sX(ed.L.cols * T), H); ctx.stroke();
            if (ed.so && O[ed.so.i]) { const [w, h] = dims(ed.so); ctx.strokeStyle = '#ff0'; ctx.lineWidth = 2; ctx.strokeRect(sX(ed.so.x * T), sY((ed.so.y + h) * T), w * T, h * T); }
            if (edDrag && edDrag.m === 'rect') { const x1 = Math.min(edDrag.x, edDrag.x2), x2 = Math.max(edDrag.x, edDrag.x2), y1 = Math.min(edDrag.y, edDrag.y2), y2 = Math.max(edDrag.y, edDrag.y2); ctx.fillStyle = 'rgba(255,255,255,.3)'; ctx.fillRect(sX(x1 * T), sY((y2 + 1) * T), (x2 - x1 + 1) * T, (y2 - y1 + 1) * T); }
            else if (ed.tool === 'place') { const d = O[ed.sel]; drawObj(ctx, { i: ed.sel, x: edHover.x - d.ox, y: edHover.y - d.oy, r: d.rot ? ed.rot : 0, p: d.p }, true, true); }
            else { ctx.fillStyle = ed.tool === 'erase' ? 'rgba(255,60,60,.4)' : 'rgba(255,255,255,.2)'; ctx.fillRect(sX(edHover.x * T), sY((edHover.y + 1) * T), T, T); }
            ctx.restore();
            ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(0, 0, W, 22); ctx.fillStyle = '#fff'; ctx.font = '12px sans-serif';
            const st = est(ed.L); ctx.fillText(`EDITOR · ${ed.tool} · cell ${edHover.x},${edHover.y} · objects ${ed.L.objs.length} · est. reward ⭐${st} (${DIFFN[st - 1]})`, 8, 15);
        }
        function edSettings() {
            const L = ed.L;
            const so = ['<option value="n">No music</option>', ...TRACKS.map((t, i) => `<option value="b${i}">${t.n}</option>`), ...me.songs.map((s, i) => `<option value="u${i}">${esc(s.name)}</option>`), ...(AU.local ? ['<option value="l">This session file: ' + esc(AU.local.name) + '</option>'] : [])].join('');
            const sel = L.song.t === 'b' ? 'b' + L.song.i : L.song.t === 'u' ? (me.songs.findIndex(s => s.url === L.song.url) >= 0 ? 'u' + me.songs.findIndex(s => s.url === L.song.url) : 'x') : 'n';
            show(`<div class="card" style="width:560px"><h2>Level settings</h2>
  <label>Name</label><input id="s_n" maxlength="30" value="${esc(L.name)}" style="width:95%"><label>Description</label><input id="s_d" maxlength="140" value="${esc(L.desc)}" style="width:95%">
  <label>Length (blocks)</label><input id="s_c" type="number" min="20" max="3000" value="${L.cols}">
  <label>Type</label><select id="s_m"><option value="classic" ${L.mode === 'classic' ? 'selected' : ''}>Classic (auto-run)</option><option value="platformer" ${L.mode === 'platformer' ? 'selected' : ''}>Platformer (free move)</option></select>
  <label>Start gamemode</label><select id="s_g">${SMODES.map(m => `<option ${L.sm === m ? 'selected' : ''}>${m}</option>`).join('')}</select>
  <label>Start speed</label><select id="s_s">${SPN.map((n, i) => `<option value="${i}" ${L.sp === i ? 'selected' : ''}>${n}</option>`).join('')}</select>
  <label><input type="checkbox" id="s_mi" ${L.mini ? 'checked' : ''}> Start mini</label><label><input type="checkbox" id="s_gs" ${L.gs === -1 ? 'checked' : ''}> Start with gravity up</label>
  <label>Background colour</label><input type="color" id="s_bg" value="${L.bg}"><label>Ground colour</label><input type="color" id="s_gr" value="${L.gr}">
  <label>Song</label><select id="s_so">${so}</select><label>Start offset in song (seconds)</label><input id="s_of" type="number" min="0" step=".5" value="${L.song.off || 0}">
  <br><br><button onclick="AU.stop()">■ Stop preview</button><button onclick="edSetApply()">✔ Done</button></div>`, true);
            if (sel !== 'x') $('s_so').value = sel;
        }
        function edSetApply() {
            const L = ed.L; L.name = $('s_n').value.trim().slice(0, 30) || 'My Level'; L.desc = $('s_d').value.slice(0, 140); L.cols = clamp(+$('s_c').value || 150, 20, 3000); L.mode = $('s_m').value; L.sm = $('s_g').value; L.sp = +$('s_s').value; L.mini = $('s_mi').checked ? 1 : 0; L.gs = $('s_gs').checked ? -1 : 1; L.bg = $('s_bg').value; L.gr = $('s_gr').value;
            const v = $('s_so').value, off2 = Math.max(0, +$('s_of').value || 0);
            if (v === 'n') L.song = { t: 'n' }; else if (v[0] === 'b') L.song = { t: 'b', i: +v.slice(1), off: 0 }; else if (v[0] === 'u') { const s = me.songs[+v.slice(1)]; L.song = { t: 'u', url: s.url, name: s.name, off: off2 }; } else if (v === 'l' && AU.local) L.song = { t: 'u', url: AU.local.url, name: AU.local.name, off: off2 };
            AU.stop(); hideUI(); edChanged(); edBar();
        }
        async function edPublish() {
            const L = ed.L; if (L.name.trim().length < 3) return toast('Give your level a name (3+ characters)');
            if (!L.objs.some(o => O[o.i] && O[o.i].k === 'solid' || O[o.i] && O[o.i].k === 'haz')) return toast('Add some obstacles first');
            if (!(L.ver && L.ver === edHash())) return toast('Finish your level with Test first to verify it');
            const c = cleanLevel(L); if (!c) return toast('Level is invalid or too large (max 12000 objects)'); c.author = me.nick;
            if (c.song.t === 'n' && L.song.t === 'u') toast('Note: local files cannot be published, music removed');
            try { await net.publish(c, est(c)); edSaveDraft(); toast('Published! ⭐' + est(c) + ' reward for players'); } catch (e) { toast('Publish failed: ' + e.message); }
        }
        function edShare() { const c = cleanLevel(ed.L); show(`<div class="card" style="width:600px"><h2>Share code</h2><p style="font-size:13px">Send this code to a friend. They can import it in the Editor or Online Levels.</p><textarea id="sc" readonly>${c ? encodeLv(c) : ''}</textarea><br><button onclick="$('sc').select();document.execCommand('copy');toast('Copied')">Copy</button><button onclick="hideUI()">Close</button></div>`, true); }

        // =============================================================== MAIN LOOP
        let last = performance.now(), acc = 0;
        function loop(now) {
            const dt = Math.min(.05, (now - last) / 1000); last = now; gt += dt;
            if (mode === 'play') { acc += dt; let n = 0; while (acc >= DT && n++ < 20) { step(DT); acc -= DT; if (mode !== 'play') break; } shakeT = Math.max(0, shakeT - dt); flashT = Math.max(0, flashT - dt); }
            for (const q of parts) { q.x += q.vx * dt; q.y += q.vy * dt; q.vy -= 500 * dt; q.l -= dt; } parts = parts.filter(q => q.l > 0);
            if (mode === 'play' || mode === 'pause' || mode === 'win') drawPlay();
            else if (mode === 'edit') drawEditor(dt);
            else {
                vw = W; vh = H; camX = gt * 120; camY = -120; pl = null; bgc = [25, 40, 110]; grc = [15, 25, 70]; ctx.save(); drawBG(ctx, true); ctx.restore();
                if (shop.pv && $('pv')) { const c = shop.pv; c.clearRect(0, 0, 520, 90);['cube', 'ship', 'ball', 'ufo', 'wave', 'robot', 'spider', 'swing'].forEach((m, i) => drawPlayer(c, 35 + i * 64, 45, 34, m, m === 'ship' || m === 'wave' ? -.3 : gt * (m === 'ball' ? 3 : 0), 1, me.icon)); }
            }
            requestAnimationFrame(loop);
        }
        const lastKey = DB.get('sd_last', null);
        if (lastKey && accts[lastKey] && !net.on()) { me = accts[lastKey]; menu(); } else accountScreen();
        requestAnimationFrame(loop);
    </script>
